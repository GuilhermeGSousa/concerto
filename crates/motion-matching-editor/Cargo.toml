[package]
name = "concerto-motion-matching-editor"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
concerto-animation.workspace = true
concerto-animation-editor.workspace = true
concerto-app.workspace = true
concerto-color.workspace = true
concerto-debug-gizmos.workspace = true
concerto-ecs.workspace = true
concerto-editor.workspace = true
concerto-foundation.workspace = true
concerto-mesh.workspace = true
concerto-motion-matching.workspace = true
concerto-motion-matching-gizmos.workspace = true
concerto-reflect.workspace = true
concerto-ui.workspace = true
concerto-window.workspace = true
glam.workspace = true
log = "0.4"
pollster = "0.4.0"
uuid = { version = "1.18.1", features = ["v4", "js", "serde"] }

[dev-dependencies]
concerto = { path = "../.." }
concerto-editor = { workspace = true, features = ["testing"] }
concerto-mcp.workspace = true
concerto-render.workspace = true
rmcp = { version = "3.5", features = ["client", "transport-io"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "io-util", "macros", "time"] }
