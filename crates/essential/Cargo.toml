[package]
name = "essential"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
asset-format = { path = "../asset-format" }
editable = { path = "../editable" }
ecs = { path = "../ecs" }
tasks = { path = "../tasks" }
bytemuck = { version = "1.22.0", features = ["derive"] }
glam = { version = "0.30.1", features = ["serde"] }
cfg-if = "1"
crossbeam-channel = "0.5.0"
anyhow = "1.0.97"
log = "0.4.27"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
essential-macros = { path = "macros" }
derive_more = { version = "2", features = ["full"] }

[dev-dependencies]
pollster = "0.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Off-thread file reads for the content-asset loader: async-fs runs the
# blocking read on the `blocking` crate's thread pool so it never parks a
# LoadTaskPool executor thread.
async-fs = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Other dependencies
reqwest = { version = "0.12.5" }
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
] }
futures-channel = "0.3.31"
wasm-bindgen-futures = "0.4"
web-time = { version = "1.1", default-features = false }
