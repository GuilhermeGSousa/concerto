[package]
name = "concerto-terminal-renderer"
version.workspace = true
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
concerto-app.workspace = true
concerto-ecs.workspace = true
concerto-render.workspace = true
wgpu = { version = "30.0.2", default-features = false, features = [
    "wgsl",
    "std",
    "metal",
    "naga-ir",
    "fragile-send-sync-non-atomic-wasm",
] }
pollster = "0.4.0"
ratatui = "0.30.0"
derive_more = { version = "2", features = ["deref", "deref_mut", "from"] }
profiling = "1"
