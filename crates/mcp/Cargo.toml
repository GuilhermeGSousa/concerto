[package]
name = "concerto-mcp"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
concerto-app.workspace = true
concerto-ecs.workspace = true
crossbeam-channel = "0.5.0"
log = "0.4"
rmcp = { version = "3.5", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "io-util", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
