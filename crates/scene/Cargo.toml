[package]
name = "concerto-scene"
version = "0.1.0"
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
concerto-app = { path = "../app" }
concerto-core = { path = "../core" }
concerto-ecs = { path = "../ecs" }
concerto-mesh = { path = "../mesh" }
concerto-render = { path = "../render" }
concerto-animation = { path = "../animation" }
anyhow = "1.0.97"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
uuid = { version = "1.18.1", features = ["v4", "js", "serde"] }

[dev-dependencies]
glam = { version = "0.30.1" }
