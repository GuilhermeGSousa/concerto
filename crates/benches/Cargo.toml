[package]
name = "concerto-benches"
version.workspace = true
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
run = ["dep:criterion"]

[dependencies]
criterion = { version = "0.5", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
concerto = { path = "../.." }
concerto-app.workspace = true
concerto-color.workspace = true
concerto-ecs.workspace = true
concerto-render.workspace = true
concerto-scene.workspace = true
concerto-ui.workspace = true
concerto-window.workspace = true
concerto-world-grid.workspace = true

[[bench]]
name = "app_build"
harness = false
required-features = ["run"]

[[bench]]
name = "ui"
harness = false
required-features = ["run"]
