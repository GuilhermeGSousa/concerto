[package]
name = "concerto-debug-gizmos"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
concerto-app.workspace = true
concerto-foundation.workspace = true
concerto-ecs.workspace = true
concerto-render.workspace = true
concerto-color.workspace = true
glam = { version = "0.30.1" }
bytemuck = { version = "1.22.0", features = ["derive"] }
wgpu = { version = "24.0.1", default-features = false, features = [
    "wgsl",
    "metal",
    "naga-ir",
    "fragile-send-sync-non-atomic-wasm",
] }
