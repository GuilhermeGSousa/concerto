[package]
name = "concerto-gltf-loader"
version = "0.1.0"
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
concerto-app = { path = "../app" }
concerto-animation = { path = "../animation" }
concerto-asset-import = { path = "../asset-import" }
concerto-color = { path = "../color" }
concerto-core = { path = "../core" }
concerto-mesh = { path = "../mesh" }
concerto-ecs = { path = "../ecs" }
concerto-render = { path = "../render" }
concerto-physics = { path = "../physics" }
concerto-scene = { path = "../scene" }
gltf = { version = "1.4.1", features = ["KHR_lights_punctual", "extras"] }
anyhow = "1.0.97"
bincode = "1.3"
glam = { version = "0.30.1" }
log = "0.4.27"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.18.1", features = ["v4", "js"] }
serde_json = "1.0"

[dependencies.image]
version = "0.25.5"
default-features = true
