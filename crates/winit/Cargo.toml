[package]
name = "concerto-winit"
version.workspace = true
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
profiling = "1"
concerto-app.workspace = true
concerto-ecs.workspace = true
concerto-render.workspace = true
concerto-window.workspace = true
cfg-if = "1"
winit = { version = "=0.31.0-beta.4" }
glam = { version = "0.30.1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4.0"

[target.'cfg(windows)'.dependencies]
# The version winit already builds, for reading the physical mouse buttons.
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
