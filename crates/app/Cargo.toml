[package]
name = "concerto-app"
version.workspace = true
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["multithreaded"]
multithreaded = ["concerto-ecs/multithreaded"]

[dependencies]
profiling = "1"
concerto-ecs.workspace = true
concerto-reflect.workspace = true
concerto-foundation.workspace = true
log = "0.4.27"
derive_more = { version = "2", features = ["deref", "deref_mut", "from"] }
anyhow = "1.0.97"

[dev-dependencies]
concerto-tasks.workspace = true
serde = { version = "1", features = ["derive"] }
