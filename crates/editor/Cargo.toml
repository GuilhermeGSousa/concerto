[package]
name = "concerto-editor"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["mcp"]
tracy = ["profiling/profile-with-tracy"]
# The MCP server and the editor's tools (`--headless --mcp`).
mcp = ["dep:concerto-mcp", "dep:schemars"]

[dependencies]
profiling = "1"
concerto-scene.workspace = true
concerto-mesh.workspace = true
glam = "0.30.1"
concerto-world-grid.workspace = true
concerto-debug-gizmos.workspace = true
bincode = "1.3"
concerto-app.workspace = true
concerto-ecs.workspace = true
concerto-editable.workspace = true
concerto-foundation.workspace = true
concerto-render.workspace = true
concerto-window.workspace = true
concerto-ui.workspace = true
concerto-color.workspace = true
concerto-mcp = { workspace = true, optional = true }
schemars = { version = "1", optional = true }
taffy = "0.9.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
winit = "0.30"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
tempfile = "3"
glyphon = "0.8.0"
