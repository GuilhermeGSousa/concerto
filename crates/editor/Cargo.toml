[package]
name = "concerto-editor"
version = "0.1.0"
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
tracy = ["profiling/profile-with-tracy"]

[dependencies]
profiling = "1"
concerto-scene = { path = "../scene" }
concerto-mesh = { path = "../mesh" }
glam = "0.30.1"
concerto-world-grid = { path = "../world-grid" }
concerto-debug-gizmos = { path = "../debug-gizmos" }
bincode = "1.3"
concerto-app = { path = "../app" }
concerto-ecs = { path = "../ecs" }
concerto-editable = { path = "../editable" }
concerto-core = { path = "../core" }
concerto-render = { path = "../render" }
concerto-window = { path = "../window" }
concerto-ui = { path = "../ui" }
concerto-color = { path = "../color" }
taffy = "0.9.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
winit = "0.30"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
tempfile = "3"
glyphon = "0.8.0"
