[package]
name = "editor"
version = "0.1.0"
edition = "2021"

[features]
tracy = ["profiling/profile-with-tracy"]

[dependencies]
profiling = "1"
scene = { path = "../scene" }
mesh = { path = "../mesh" }
glam = "0.30.1"
world-grid = { path = "../world-grid" }
debug-gizmos = { path = "../debug-gizmos" }
bincode = "1.3"
app = { path = "../app" }
ecs = { path = "../ecs" }
editable = { path = "../editable" }
essential = { path = "../essential" }
render = { path = "../render" }
window = { path = "../window" }
ui = { path = "../ui" }
color = { path = "../color" }
taffy = "0.9.2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
winit = "0.30"
env_logger = "0.11"
log = "0.4"

[dev-dependencies]
tempfile = "3"
glyphon = "0.8.0"
