[package]
name = "concerto-editor"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
tracy = ["profiling/profile-with-tracy"]

[dependencies]
profiling = "1"
concerto-scene.workspace = true
concerto-mesh.workspace = true
glam = "0.30.1"
concerto-world-grid.workspace = true
concerto-debug-gizmos.workspace = true
bincode = "1.3"
concerto-app.workspace = true
concerto-ecs.workspace = true
concerto-reflect.workspace = true
concerto-foundation.workspace = true
concerto-render.workspace = true
concerto-window.workspace = true
concerto-winit.workspace = true
concerto-ui.workspace = true
concerto-color.workspace = true
taffy = "0.9.2"
anyhow = "1"
rfd = "0.15"
concerto-import.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "0.8"
env_logger = "0.11"
log = "0.4"
derive_more = { version = "2", features = ["full"] }
image = "0.25.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
concerto-mcp.workspace = true

[dev-dependencies]
base64 = "0.22"
concerto = { path = "../.." }
tempfile = "3"
glyphon = "0.8.0"
pollster = "0.4.0"
rmcp = { version = "3.5", features = ["client", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-util", "macros", "time"] }
