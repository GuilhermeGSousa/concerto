[package]
name = "concerto-editor"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
tracy = ["profiling/profile-with-tracy"]
testing = ["dep:tempfile"]

[dependencies]
profiling = "1"
concerto-scene.workspace = true
concerto-mesh.workspace = true
glam.workspace = true
concerto-world-grid.workspace = true
concerto-skybox.workspace = true
concerto-director.workspace = true
concerto-debug-gizmos.workspace = true
bincode = "1.3"
concerto-app.workspace = true
concerto-ecs.workspace = true
concerto-reflect.workspace = true
concerto-foundation.workspace = true
concerto-render.workspace = true
concerto-window.workspace = true
concerto-winit.workspace = true
concerto-mcp.workspace = true
concerto-ui.workspace = true
concerto-color.workspace = true
concerto-name.workspace = true
taffy = "0.9.2"
anyhow = "1"
rfd = "0.15"
concerto-import.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
toml = "1"
env_logger = "0.11"
log = "0.4"
derive_more = { version = "2", features = ["deref", "deref_mut", "from"] }
image = { version = "0.25.5", default-features = false, features = ["png"] }
tempfile = { version = "3", optional = true }

[dev-dependencies]
base64 = "0.22"
concerto = { path = "../.." }
tempfile = "3"
glyphon = "0.12.0"
proptest.workspace = true
rmcp = { version = "3.5", features = ["client", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-util", "macros", "time"] }
