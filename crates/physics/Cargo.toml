[package]
name = "concerto-physics"
version.workspace = true
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["jolt"]
# The Jolt backend, the native default. Inert on wasm targets, where
# `jolt-ffi` (C++ that cannot target wasm32) is never a dependency and the
# Rapier backend is always used.
jolt = ["dep:concerto-jolt-ffi"]
# Use the Rapier backend on native targets too, so the wasm backend can be
# built, tested, and debugged without a browser (and without the C++
# toolchain and submodule Jolt needs):
# `cargo test -p physics --no-default-features --features force-rapier`.
force-rapier = ["dep:rapier3d"]

[dependencies]
profiling = "1"
log = "0.4.27"
concerto-app.workspace = true
concerto-foundation.workspace = true
concerto-mesh.workspace = true
concerto-ecs.workspace = true
glam = { version = "0.30.1" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
concerto-jolt-ffi = { workspace = true, optional = true }
rapier3d = { version = "0.34", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rapier3d = { version = "0.34" }

[dev-dependencies]
serde_json = "1.0"
