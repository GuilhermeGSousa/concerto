[package]
name = "concerto-animation"
version = "0.1.0"
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
concerto-app = { path = "../app" }
concerto-foundation = { path = "../foundation" }
concerto-ecs = { path = "../ecs" }
concerto-mesh = { path = "../mesh" }
glam = { version = "0.30.1", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "js", "serde"] }
petgraph = { version = "0.8", features = ["serde-1"] }
log = "0.4.27"
derive_more = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
anyhow = "1.0.97"
