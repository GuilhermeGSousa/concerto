[package]
name = "concerto-ecs"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["multithreaded"]
multithreaded = ["dep:concerto-tasks", "dep:concurrent-queue"]

[dependencies]
profiling = "1"
concerto-tasks = { workspace = true, optional = true }
concerto-ecs-macros.workspace = true
concerto-reflect.workspace = true
concerto-asset-format.workspace = true
any_vec = "0.14.0"
typle = "0.10.6"
log = "0.4.27"
petgraph = { version = "0.8" }
derive_more = { version = "2", features = ["full"] }
fixedbitset = "0.5.7"
concurrent-queue = { version = "2.5.0", optional = true }
crossbeam-channel = "0.5.0"
anyhow = "1.0.97"
foldhash = { version = "0.2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot.workspace = true
