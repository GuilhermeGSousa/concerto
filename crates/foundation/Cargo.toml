[package]
name = "concerto-foundation"
version.workspace = true
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
concerto-asset-format.workspace = true
concerto-reflect.workspace = true
concerto-ecs.workspace = true
concerto-tasks.workspace = true
bytemuck = { version = "1.22.0", features = ["derive"] }
glam = { workspace = true, features = ["serde"] }
cfg-if = "1"
crossbeam-channel = "0.5.0"
anyhow = "1.0.97"
log = "0.4.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
concerto-foundation-macros.workspace = true
derive_more = { version = "2", features = ["full"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blocking = "1.7"
pollster = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Other dependencies
reqwest = { version = "0.12.5" }
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "Location",
    "Node",
] }
futures-channel = "0.3.31"
wasm-bindgen-futures = "0.4"
web-time = { version = "1.1", default-features = false }

[dev-dependencies]
proptest.workspace = true
