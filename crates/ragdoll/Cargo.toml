[package]
name = "concerto-ragdoll"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
test-support = ["dep:uuid"]

[dependencies]
anyhow = "1.0.97"
concerto-animation.workspace = true
concerto-app.workspace = true
concerto-ecs.workspace = true
concerto-foundation.workspace = true
concerto-mesh.workspace = true
concerto-name.workspace = true
concerto-physics.workspace = true
concerto-reflect.workspace = true
glam = { workspace = true, features = ["serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.18.1", features = ["v5"], optional = true }

[dev-dependencies]
bincode = "1.3"
concerto-ragdoll = { path = ".", features = ["test-support"] }
proptest.workspace = true
uuid = { version = "1.18.1", features = ["v4"] }
