[package]
name = "concerto-window"
version.workspace = true
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
concerto-app.workspace = true
concerto-ecs.workspace = true
winit = { version = "=0.31.0-beta.4" }
glam = { version = "0.30.1" }
log = "0.4.27"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
