[package]
name = "concerto-import"
version = "0.1.0"
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
concerto-asset-import = { path = "../asset-import" }
concerto-core = { path = "../core" }
concerto-gltf-loader = { path = "../gltf-loader" }
concerto-obj-loader = { path = "../obj-loader" }
concerto-render = { path = "../render" }
anyhow = "1.0.97"
env_logger = "0.11.6"
log = "0.4.27"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"

[dev-dependencies]
concerto-scene = { path = "../scene" }
concerto-mesh = { path = "../mesh" }
concerto-ecs = { path = "../ecs" }
serde_json = "1.0"
bincode = "1.3"
pollster = "0.4.0"
