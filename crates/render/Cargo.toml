[package]
name = "concerto-render"
version.workspace = true
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
profiling = "1"
concerto-app.workspace = true
concerto-color.workspace = true
concerto-reflect.workspace = true
concerto-foundation.workspace = true
concerto-ecs.workspace = true
concerto-mesh.workspace = true
concerto-window.workspace = true
concerto-render-macros.workspace = true
bitflags = "2.9.1"
encase = "0.13"
glam = { workspace = true, features = ["encase-013"] }
bytemuck = { version = "1.22.0", features = ["derive"] }
log = "0.4.26"
wgpu = { version = "30.0.2", default-features = false, features = [
    "wgsl",
    "std",
    "metal",
    "naga-ir",
    "fragile-send-sync-non-atomic-wasm",
] }
wgpu-types = { version = "30", default-features = false, features = ["serde"] }
anyhow = "1.0.97"
bincode = "1.3"
derive_more = { version = "2", features = ["deref", "deref_mut", "from"] }
concerto-asset-import.workspace = true
serde = { version = "1", features = ["derive"] }
naga_oil = { version = "0.23.0", default-features = false }

pollster = "0.4.0"

[dependencies.image]
version = "0.25.5"
default-features = false
features = ["png", "jpeg"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
intel_tex_2 = "0.5"
link-cplusplus = "1"

[target.'cfg(any(windows, all(unix, not(target_arch = "wasm32"), not(target_vendor = "apple"))))'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["vulkan"] }

[target.'cfg(all(unix, not(target_arch = "wasm32"), not(target_vendor = "apple")))'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["gles"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["std", "webgl"] }

[dev-dependencies]
naga = { version = "30", features = ["glsl-out"] }
