[package]
name = "concerto-skybox"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
concerto-app.workspace = true
concerto-foundation.workspace = true
concerto-ecs.workspace = true
concerto-render.workspace = true
glam = { version = "0.30.1" }
bytemuck = { version = "1.22.0", features = ["derive"] }
env_logger = "0.11.6"
log = "0.4.26"
wgpu = { version = "24.0.1", default-features = false, features = [
    "wgsl",
    "metal",
    "naga-ir",
    "fragile-send-sync-non-atomic-wasm",
    
] }
wgpu-types = { version = "24", default-features = false }
derive_more = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
