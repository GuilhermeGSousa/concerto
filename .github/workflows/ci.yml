name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build_wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      # No submodules needed: wasm builds use the pure-Rust Rapier physics
      # backend, so jolt-ffi (and with it the JoltPhysics submodule) is not
      # a dependency.
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build WASM target
        run: cargo build --target wasm32-unknown-unknown
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # jolt-ffi builds the Jolt Physics C++ sources from a submodule.
          submodules: true

      - name: Free disk space
        # The workspace's test binaries outgrow the free space on an Ubuntu
        # runner ("No space left on device"). Drop preinstalled SDKs this
        # job never uses.
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # v2: built with the slimmer debug info below; older caches would
          # only add stale artefacts to the disk.
          key: ${{ matrix.os }}-cargo-test-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-test-v2-

      - name: Run tests
        # Runs the physics suite against the Jolt backend (the native
        # default); the same suite runs against the Rapier backend in the
        # test_physics_rapier job.
        run: cargo test --workspace
        env:
          # Full debug info more than doubles the size of target/. Line
          # tables keep file and line numbers in backtraces.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_INCREMENTAL: 0

  test_physics_rapier:
    name: Test Physics (Rapier backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No submodules needed: the Rapier backend is pure Rust and builds
      # without jolt-ffi.
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rapier-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rapier-

      - name: Run physics tests against the Rapier backend
        run: cargo test -p concerto-physics --no-default-features --features force-rapier

  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # jolt-ffi builds the Jolt Physics C++ sources from a submodule.
          submodules: true
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.toml') }}
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - name: Run clippy
        run: cargo clippy -- -A clippy::type_complexity -A clippy::too_many_arguments -D warnings
      - name: Run clippy on the Rapier physics backend
        run: cargo clippy -p concerto-physics --no-default-features --features force-rapier -- -A clippy::type_complexity -A clippy::too_many_arguments -D warnings
        
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check