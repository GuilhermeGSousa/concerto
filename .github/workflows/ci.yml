name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build_wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      # No submodules needed: wasm builds use the pure-Rust Rapier physics
      # backend, so jolt-ffi (and with it the JoltPhysics submodule) is not
      # a dependency.
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build WASM target
        run: cargo build --locked --target wasm32-unknown-unknown
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # jolt-ffi builds the Jolt Physics C++ sources from a submodule.
          submodules: true

      - uses: ./.github/actions/lfs-pull

      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        # Runs the physics suite against the Jolt backend (the native
        # default); the same suite runs against the Rapier backend in the
        # test_physics_rapier job.
        run: cargo test --locked --workspace
        env:
          CARGO_INCREMENTAL: 0

  test_physics_rapier:
    name: Test Physics (Rapier backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No submodules needed: the Rapier backend is pure Rust and builds
      # without jolt-ffi.
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run physics tests against the Rapier backend
        run: cargo test --locked -p concerto-physics --no-default-features --features force-rapier

  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          # jolt-ffi builds the Jolt Physics C++ sources from a submodule.
          submodules: true
      - uses: ./.github/actions/lfs-pull
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -A clippy::type_complexity -A clippy::too_many_arguments -D warnings
      - name: Run clippy on the Rapier physics backend
        run: cargo clippy --locked -p concerto-physics --no-default-features --features force-rapier -- -A clippy::type_complexity -A clippy::too_many_arguments -D warnings
        
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check