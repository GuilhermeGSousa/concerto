name: Pull Git LFS objects
description: Restores the LFS store from the Actions cache, then downloads only the objects it lacks.
runs:
  using: composite
  steps:
    - name: List LFS objects
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f 1 | sort > .lfs-objects
    - name: Cache LFS objects
      uses: actions/cache@v4
      with:
        path: .git/lfs/objects
        key: ${{ runner.os }}-lfs-${{ hashFiles('.lfs-objects') }}
        restore-keys: |
          ${{ runner.os }}-lfs-
    - name: Pull LFS objects
      shell: bash
      run: git lfs pull
