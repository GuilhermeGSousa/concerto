[profile.release]
strip = true

# Release-speed build that keeps debug symbols, for profilers (samply, perf,
# flamegraph, Tracy). Usage: cargo run --profile profiling -p render-test
# See docs/profiling.md.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.profiling.package.concerto-jolt-ffi]
debug = true

[package]
name = "concerto"
version = "0.1.0"
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["multithreaded"]
multithreaded = ["concerto-app/multithreaded"]
# Enables the Tracy backend for all `profiling` spans (engine + wgpu
# internals). Native only — never enable for wasm builds.
tracy = ["profiling/profile-with-tracy"]

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/*", "examples/*"]

[workspace.package]
description = "A game engine for character-driven, high-fidelity cinematic games."
repository = "https://github.com/GuilhermeGSousa/game-engine"
license = "MIT"

[lints.rust]
warnings = "deny"

[dependencies]
profiling = "1"
concerto-app = { path = "crates/app" }
concerto-animation = { path = "crates/animation" }
concerto-core = { path = "crates/core" }
concerto-render = { path = "crates/render" }
concerto-director = { path = "crates/director" }
concerto-mesh = { path = "crates/mesh" }
concerto-gameplay = { path = "crates/gameplay" }
concerto-window = { path = "crates/window" }
concerto-ecs = { path = "crates/ecs" }
concerto-color = { path = "crates/color" }
concerto-ui = { path = "crates/ui" }
concerto-scene = { path = "crates/scene" }
concerto-skybox = { path = "crates/skybox" }
concerto-world-grid = { path = "crates/world-grid" }
# Physics runs everywhere: Jolt natively, Rapier on the web (Jolt's C++
# requires thread primitives that wasm32 toolchains do not provide).
concerto-physics = { path = "crates/physics" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24.0.1", features = ["webgl"] }

[profile.dev.package.concerto-jolt-ffi]
opt-level = 3
