[package]
name = "animation-test"
version = "0.1.0"
edition = "2021"
publish = false
description.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["multithreaded"]
multithreaded = ["concerto/multithreaded"]
tracy = ["concerto/tracy"]

[lints.rust]
warnings = "deny"

[dependencies]
concerto = { path = "../.." }
concerto-gameplay = { path = "../../crates/gameplay" }
concerto-debug-gizmos = { path = "../../crates/debug-gizmos" }
concerto-color = { path = "../../crates/color" }
cfg-if = "1.0.0"
env_logger = "0.11.8"
glam = { version = "0.30.1" }
log = "0.4.27"
winit = { version = "0.30" }
concerto-world-grid = { path = "../../crates/world-grid" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.77", features = ["Document", "Window", "Element"] }

[build-dependencies]
concerto-asset-build = { path = "../../crates/asset-build" }
anyhow = "1.0.97"
fs_extra = "1.3.0"
