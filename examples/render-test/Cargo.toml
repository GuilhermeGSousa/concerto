[package]
name = "render-test"
version = "0.1.0"
edition = "2021"
description.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "render-test"
path = "src/main.rs"

[features]
tracy = ["concerto/tracy"]
terminal = ["dep:concerto-terminal-renderer", "dep:ratatui"]

[dependencies]
concerto = { path = "../.." }
concerto-app = { path = "../../crates/app" }
concerto-ecs = { path = "../../crates/ecs" }
concerto-core = { path = "../../crates/core" }
concerto-color = { path = "../../crates/color" }
concerto-render = { path = "../../crates/render" }
concerto-debug-gizmos = { path = "../../crates/debug-gizmos" }
concerto-world-grid = { path = "../../crates/world-grid" }
concerto-terminal-renderer = { path = "../../crates/terminal-renderer", optional = true }
concerto-gameplay = { path = "../../crates/gameplay" }
glam = "0.30.1"
ratatui = { version = "0.30.0", optional = true }
cfg-if = "1.0.0"
env_logger = "0.11.8"
wgpu-types = { version = "24", default-features = false }
winit = { version = "0.30" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
log = "0.4.27"

[build-dependencies]
concerto-asset-build = { path = "../../crates/asset-build" }
anyhow = "1.0.97"
fs_extra = "1.3.0"
