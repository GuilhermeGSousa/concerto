[package]
name = "tech-demo"
version = "0.1.0"
edition = "2024"
publish = false
description.workspace = true
repository.workspace = true
license.workspace = true

[package.metadata.concerto.editor]
plugins = [
    { package = "concerto-animation-editor", install = "concerto_animation_editor::install" },
    { package = "concerto-motion-matching-editor", install = "concerto_motion_matching_editor::install" },
]

[features]
tracy = ["concerto/tracy"]

[dependencies]
concerto = { path = "../.." }
glam = { version = "0.30.1" }
serde = { version = "1", features = ["derive"] }
derive_more = { version = "2", features = ["full"] }

[dev-dependencies]
bincode = "1.3"

[build-dependencies]
concerto-asset-build = { path = "../../crates/asset-build" }
anyhow = "1.0.97"
fs_extra = "1.3.0"