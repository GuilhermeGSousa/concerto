[package]
name = "after-hours"
version = "0.1.0"
edition = "2024"
publish = false
description = "AFTER HOURS: a first-person mannequin horror game built on Concerto."
repository.workspace = true
license.workspace = true

[dependencies]
concerto = { path = "../.." }
glam = { version = "0.30.1" }
cfg-if = "1.0.0"
env_logger = "0.11.8"
log = "0.4.27"
winit = { version = "0.30" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Document",
    "DomStringMap",
    "Element",
    "HtmlElement",
    "Storage",
    "Window",
] }

[build-dependencies]
concerto-asset-build = { path = "../../crates/asset-build" }
anyhow = "1.0.97"
